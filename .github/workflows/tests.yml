name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests (trains the model once if it is missing)
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (includes model training)
        run: docker build -t dropout-api .
      - name: Start container and check /health
        run: |
          docker run -d -p 8000:8000 --name api dropout-api
          for i in $(seq 1 30); do
            if curl -fsS localhost:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs api
          exit 1
